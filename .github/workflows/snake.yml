name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # tiap hari jam 00:00 UTC
  workflow_dispatch: {} # bisa dijalankan manual dari tab Actions
  push:
    branches:
      - main # sesuaikan kalau branch utama kamu bukan "main"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_dots=#30363d,#0e4429,#006d32,#26a641,#39d353&color_snake=#ff5ac4

      - name: Push snake SVG ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}